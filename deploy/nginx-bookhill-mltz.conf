# Promo page for BookHill at bookhill.mltz.tech (website/ in this repo, shipped by website/deploy.sh).
# Same pattern as the other *.mltz.tech static sites on vpsde: shared Cloudflare Origin Certificate.
server {
    listen 80;
    listen [::]:80;
    server_name bookhill.mltz.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bookhill.mltz.tech;

    # Cloudflare Origin Certificate (wildcard *.mltz.tech — shared with the other mltz sites)
    ssl_certificate /etc/ssl/cloudflare/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /home/carlos/bookhill-site/public;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml;
    gzip_min_length 512;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|svg|webp|png|woff2?|ttf|eot|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
