# Rate limit for the syntax parser (/api/parse). Behind Cloudflare the TCP peer
# is a Cloudflare edge, so key on the visitor from CF-Connecting-IP (the origin
# address is not public, so the header cannot be spoofed around Cloudflare).
map $http_cf_connecting_ip $langlsrw_client {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $langlsrw_client zone=langlsrw_parse:10m rate=3r/s;

server {
    listen 80;
    listen [::]:80;
    server_name lang.mltz.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lang.mltz.tech;

    # Cloudflare Origin Certificate (wildcard *.mltz.tech — shared with the
    # other sites on this box, e.g. faro-mltz). Do not provision a new cert.
    ssl_certificate /etc/ssl/cloudflare/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /home/carlos/langlsrw/public;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml;
    gzip_min_length 512;

    # index.html: always revalidate (cheap 304s), so a deploy's new ?v= stamps
    # are picked up immediately. The site serves code only; user data lives in
    # each user's Google Drive.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Syntax parser: services/parser in Docker on 127.0.0.1:18300 (stateless).
    location = /api/parse {
        limit_req zone=langlsrw_parse burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:18300;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
    }

    location = /api/parse/health {
        proxy_pass http://127.0.0.1:18300;
        add_header Cache-Control "no-store" always;
    }

    # Every URL below is content-versioned by deploy/deploy.sh (?v=<hash>), so
    # it can be cached as immutable. Only add_header (no `expires`), otherwise
    # nginx sends two Cache-Control headers.
    location ~* \.(?:css|js|svg|woff2?|ttf|eot|ico)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
